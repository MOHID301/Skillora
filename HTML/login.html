<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Skillora</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .auth-page {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: var(--text-soft);
            font-size: 15px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 34px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            background: var(--bg-soft);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-family: "DM Sans", sans-serif;
            font-size: 14px;
            transition: 0.2s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .password-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-password {
            font-size: 13px;
            color: var(--accent);
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .auth-submit {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: var(--accent);
            color: #0b0d10;
            font-family: "DM Sans", sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .auth-submit:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            display: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .auth-message.success {
            display: block;
            background: rgba(215, 255, 79, 0.1);
            color: var(--accent);
            border: 1px solid rgba(215, 255, 79, 0.25);
        }

        .auth-message.error {
            display: block;
            background: rgba(255, 80, 80, 0.1);
            color: #ff7070;
            border: 1px solid rgba(255, 80, 80, 0.2);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-soft);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .auth-page {
                padding: 40px 16px;
            }

            .auth-card {
                padding: 25px 20px;
            }

            .auth-header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-container">

            <a href="/HTML/index.html" class="logo">
                Skill<span>ora</span>
            </a>

            <nav class="nav-links" id="navLinks">
                <a href="/HTML/services.html">Services</a>
                <a href="/HTML/products.html">Products</a>
                <a href="/HTML/articles.html">Articles</a>
                <a href="/HTML/about.html">About</a>
            </nav>

            <div class="nav-actions">

                <button class="theme-btn" id="themeBtn">
                    <span id="themeIcon">☀</span>
                </button>

                <a href="/HTML/login.html" class="login-btn">
                    Log in
                </a>

                <a href="/HTML/signup.html" class="signup-btn">
                    Join Skillora
                </a>

                <button class="menu-btn" id="menuBtn">
                    ☰
                </button>

            </div>
        </div>
    </header>


    <!-- LOGIN -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Log in to continue to Skillora.</p>
            </div>

            <div class="auth-card">

                <div id="authMessage" class="auth-message"></div>

                <form id="loginForm" class="auth-form">

                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>


                    <div class="form-group">

                        <div class="password-row">
                            <label for="password">Password</label>

                            <a href="#" class="forgot-password">
                                Forgot password?
                            </a>
                        </div>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="loginSubmit"
                    >
                        Log in
                    </button>

                </form>


                <div class="auth-footer">
                    Don't have an account?
                    <a href="/HTML/signup.html">Create one</a>
                </div>

            </div>

        </div>

    </main>


    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/SCRIPTS/supabase.js"></script>

    <script src="/SCRIPTS/auth.js"></script>

    <script src="/SCRIPTS/login.js"></script>

</body>
</html>
