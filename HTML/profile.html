<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile — Skillora</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           PROFILE PAGE
        ========================================= */

        .profile-page {
            min-height: calc(100vh - 78px);
            padding: 80px 20px;
        }

        .profile-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-header {
            margin-bottom: 35px;
        }

        .profile-header .eyebrow {
            margin-bottom: 10px;
        }

        .profile-header h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 42px;
            letter-spacing: -1.5px;
        }

        .profile-header p {
            margin-top: 10px;
            color: var(--text-soft);
        }


        /* =========================================
           PROFILE CARD
        ========================================= */

        .profile-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
        }


        /* =========================================
           PROFILE TOP
        ========================================= */

        .profile-top {
            display: flex;
            align-items: center;
            gap: 22px;

            padding-bottom: 30px;
            margin-bottom: 30px;

            border-bottom: 1px solid var(--border);
        }

        .profile-avatar {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            background: var(--accent);
            color: #101300;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Space Grotesk", sans-serif;
            font-size: 30px;
            font-weight: 700;

            flex-shrink: 0;
        }

        .profile-name h2 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 25px;
        }

        .profile-name p {
            margin-top: 5px;
            color: var(--text-soft);
            font-size: 14px;
        }


        /* =========================================
           PROFILE DETAILS
        ========================================= */

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .profile-field {
            padding: 18px;

            background: var(--bg-soft);

            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .profile-field.full {
            grid-column: 1 / -1;
        }

        .profile-field-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;

            margin-bottom: 7px;
        }

        .profile-field-value {
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
        }


        /* =========================================
           ROLE BADGE
        ========================================= */

        .role-badge {
            display: inline-flex;
            align-items: center;

            padding: 5px 10px;

            border-radius: 20px;

            background: rgba(215, 255, 79, .1);
            border: 1px solid rgba(215, 255, 79, .2);

            color: var(--accent);

            font-size: 12px;
            font-weight: 700;

            text-transform: capitalize;
        }


        /* =========================================
           EDIT BUTTON
        ========================================= */

        .profile-actions {
            display: flex;
            justify-content: flex-end;

            margin-top: 30px;
        }

        .edit-profile-btn {
            padding: 12px 20px;

            background: var(--accent);
            color: #101300;

            border: none;
            border-radius: 9px;

            font-weight: 700;
            cursor: pointer;

            transition: .2s ease;
        }

        .edit-profile-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }


        /* =========================================
           LOADING
        ========================================= */

        .profile-loading {
            text-align: center;
            padding: 80px 20px;

            color: var(--text-soft);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .profile-page {
                padding: 55px 16px;
            }

            .profile-header h1 {
                font-size: 34px;
            }

            .profile-card {
                padding: 24px 18px;
            }

            .profile-top {
                align-items: flex-start;
            }

            .profile-avatar {
                width: 65px;
                height: 65px;
                font-size: 24px;
            }

            .profile-details {
                grid-template-columns: 1fr;
            }

            .profile-field.full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================
         NAVBAR
    ========================================= -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="/HTML/index.html" class="logo">
                Skill<span>ora</span>
            </a>


            <nav class="nav-links" id="navLinks">

                <a href="/HTML/services.html">Services</a>
                <a href="/HTML/products.html">Products</a>
                <a href="/HTML/articles.html">Articles</a>
                <a href="/HTML/about.html">About</a>

            </nav>


            <div class="nav-actions">

                <button
                    class="theme-btn"
                    id="themeBtn"
                >
                    <span id="themeIcon">☀</span>
                </button>


                <a
                    href="/HTML/login.html"
                    class="login-btn"
                >
                    Log in
                </a>


                <a
                    href="/HTML/signup.html"
                    class="signup-btn"
                >
                    Join Skillora
                </a>


                <button
                    class="menu-btn"
                    id="menuBtn"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <!-- =========================================
         PROFILE
    ========================================= -->

    <main class="profile-page">

        <div class="profile-container">

            <div class="profile-header">

                <span class="eyebrow">
                    ACCOUNT
                </span>

                <h1>
                    My Profile
                </h1>

                <p>
                    View and manage your Skillora account.
                </p>

            </div>


            <div
                id="profileLoading"
                class="profile-loading"
            >
                Loading profile...
            </div>


            <div
                id="profileCard"
                class="profile-card"
                style="display: none;"
            >

                <div class="profile-top">

                    <div
                        class="profile-avatar"
                        id="profileAvatar"
                    >
                        U
                    </div>


                    <div class="profile-name">

                        <h2 id="profileDisplayName">
                            User
                        </h2>

                        <p id="profileDisplayUsername">
                            @username
                        </p>

                    </div>

                </div>


                <div class="profile-details">

                    <div class="profile-field">

                        <div class="profile-field-label">
                            Full Name
                        </div>

                        <div
                            class="profile-field-value"
                            id="profileFullName"
                        >
                            —
                        </div>

                    </div>


                    <div class="profile-field">

                        <div class="profile-field-label">
                            Username
                        </div>

                        <div
                            class="profile-field-value"
                            id="profileUsername"
                        >
                            —
                        </div>

                    </div>


                    <div class="profile-field full">

                        <div class="profile-field-label">
                            Email
                        </div>

                        <div
                            class="profile-field-value"
                            id="profileEmail"
                        >
                            —
                        </div>

                    </div>


                    <div class="profile-field">

                        <div class="profile-field-label">
                            Account Type
                        </div>

                        <div>

                            <span
                                class="role-badge"
                                id="profileRole"
                            >
                                Buyer
                            </span>

                        </div>

                    </div>


                    <div class="profile-field">

                        <div class="profile-field-label">
                            Member Since
                        </div>

                        <div
                            class="profile-field-value"
                            id="profileCreatedAt"
                        >
                            —
                        </div>

                    </div>

                </div>


                <div class="profile-actions">

                    <button
                        class="edit-profile-btn"
                        id="editProfileBtn"
                    >
                        Edit Profile
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================================
         SCRIPTS
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/SCRIPTS/supabase.js"></script>

    <script src="/SCRIPTS/auth.js"></script>

    <script src="/SCRIPTS/profile.js"></script>

</body>

</html>
