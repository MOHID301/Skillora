<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skillora — Create Account</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =========================================
           AUTH PAGE
        ========================================= */

        .auth-page {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 20px;
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: "";
            position: absolute;

            width: 600px;
            height: 600px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: radial-gradient(
                circle,
                rgba(215, 255, 79, .08),
                transparent 65%
            );

            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            padding: 38px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;

            box-shadow: 0 30px 80px rgba(0, 0, 0, .25);
        }

        .auth-heading {
            margin-bottom: 30px;
        }

        .auth-heading .eyebrow {
            margin-bottom: 12px;
        }

        .auth-heading h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 38px;
            line-height: 1.05;

            letter-spacing: -1.5px;
        }

        .auth-heading p {
            margin-top: 12px;

            color: var(--text-soft);

            font-size: 14px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            color: var(--text-soft);

            font-size: 12px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            background: #101318;

            color: var(--text);

            border: 1px solid var(--border);

            border-radius: 9px;

            outline: none;

            transition: .2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .auth-submit {
            width: 100%;

            margin-top: 5px;

            padding: 14px;

            background: var(--accent);

            color: #101300;

            border-radius: 9px;

            font-weight: 700;

            transition: .2s;
        }

        .auth-submit:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .auth-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            display: none;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 12px;
        }

        .auth-message.show {
            display: block;
        }

        .auth-message.error {
            background: rgba(255, 80, 80, .08);
            border: 1px solid rgba(255, 80, 80, .25);
            color: #ff8585;
        }

        .auth-message.success {
            background: rgba(215, 255, 79, .08);
            border: 1px solid rgba(215, 255, 79, .25);
            color: var(--accent);
        }

        .auth-footer {
            margin-top: 25px;

            padding-top: 22px;

            border-top: 1px solid var(--border);

            text-align: center;

            color: var(--text-muted);

            font-size: 12px;
        }

        .auth-footer a {
            color: var(--accent);
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }


        /* =========================================
           LIGHT MODE
        ========================================= */

        body.light-mode .form-group input {
            background: #f6f7f5;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 760px) {

            .auth-page {
                min-height: calc(100vh - 78px);
                padding: 45px 14px;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            .auth-heading h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 430px) {

            .auth-page {
                padding: 30px 12px;
            }

            .auth-card {
                padding: 25px 18px;
            }

            .auth-heading h1 {
                font-size: 29px;
            }
        }
    </style>
</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="/HTML/index.html" class="logo">
                Skill<span>ora</span>
            </a>

            <nav class="nav-links" id="navLinks">

                <a href="/HTML/services.html">Services</a>
                <a href="/HTML/products.html">Products</a>
                <a href="/HTML/articles.html">Articles</a>
                <a href="/HTML/about.html">About</a>

            </nav>

            <div class="nav-actions">

                <button
                    class="theme-btn"
                    id="themeBtn"
                    aria-label="Toggle theme"
                >
                    <span id="themeIcon">☀</span>
                </button>

                <a href="/HTML/login.html" class="login-btn">
                    Log in
                </a>

                <button class="signup-btn">
                    Join Skillora
                </button>

                <button
                    class="menu-btn"
                    id="menuBtn"
                    aria-label="Open menu"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <!-- ================= SIGNUP ================= -->

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-heading">

                    <span class="eyebrow">
                        JOIN SKILLORA
                    </span>

                    <h1>
                        Create your account.
                    </h1>

                    <p>
                        Join Skillora and start discovering skills,
                        services and opportunities.
                    </p>

                </div>


                <div
                    class="auth-message"
                    id="authMessage"
                ></div>


                <form
                    class="auth-form"
                    id="signupForm"
                >

                    <div class="form-group">

                        <label for="fullName">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Choose a username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="At least 6 characters"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="signupSubmit"
                    >
                        Create account
                    </button>

                </form>


                <div class="auth-footer">

                    Already have an account?

                    <a href="/HTML/login.html">
                        Log in
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= SCRIPTS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/SCRIPTS/supabase.js"></script>

    <script src="/SCRIPTS/auth.js"></script>

    <script src="/SCRIPTS/signup.js"></script>

</body>

</html>
